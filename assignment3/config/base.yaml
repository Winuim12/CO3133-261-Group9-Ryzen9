# Configuration contract only; training/data implementations are still pending.
labels:
  very_negative: 0
  negative: 1
  neutral: 2
  positive: 3
  very_positive: 4

data:
  raw_dir: data/raw/memotion
  train_manifest: data/manifests/train.csv
  val_manifest: data/manifests/val.csv
  test_manifest: data/manifests/test.csv
  vocabulary: data/processed/vocabulary.json
  text_column: text_corrected
  image_size: 224
  max_text_length: 64
  pad_id: 0
  unk_id: 1

model:
  image_encoder: resnet18
  image_weights: IMAGENET1K_V1
  freeze_image_encoder: true
  text_encoder: gru
  embedding_dim: 128
  text_feature_dim: 256
  projection_dim: 256
  dropout: 0.3
  num_classes: 5

training:
  seed: 42
  device: auto
  batch_size: 32
  num_workers: 0
  epochs: 20
  optimizer: adamw
  learning_rate: 0.001
  weight_decay: 0.0001
  early_stopping_patience: 5
  selection_metric: macro_f1

outputs:
  runs_dir: results/runs
  checkpoints_dir: checkpoints
