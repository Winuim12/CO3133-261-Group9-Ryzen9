name: Assignment 3 CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - "assignment3/**"
      - ".github/workflows/assignment3-ci.yaml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assignment3-tests:
    name: assignment3-tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: assignment3
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect Assignment 3 changes
        id: changes
        working-directory: .
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --quiet "${BASE_SHA}...${HEAD_SHA}" -- \
            assignment3/ .github/workflows/assignment3-ci.yaml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Assignment 3 unchanged; bootstrap checks are unnecessary."
          else
            status=$?
            if [[ "$status" -ne 1 ]]; then
              exit "$status"
            fi
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.changes.outputs.changed == 'true'
        uses: actions/setup-python@v5
        with:
          python-version-file: assignment3/.python-version
          cache: pip
          cache-dependency-path: |
            assignment3/requirements.txt
            assignment3/requirements-cpu.txt

      - name: Install CPU dependencies
        if: steps.changes.outputs.changed == 'true'
        run: |
          python -m pip install -r requirements-cpu.txt
          python -m pip check

      - name: Validate CPU and GPU Compose configuration
        if: steps.changes.outputs.changed == 'true'
        run: |
          docker compose -f compose.yaml config --quiet
          docker compose -f compose.yaml -f compose.gpu.yaml config --quiet

      - name: Check CPU environment
        if: steps.changes.outputs.changed == 'true'
        run: python -m experiments.check_environment --device cpu --smoke-test

      - name: Run bootstrap tests
        if: steps.changes.outputs.changed == 'true'
        run: python -m pytest tests -v
