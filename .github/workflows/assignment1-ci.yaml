name: Assignment 1 CI

on:
  push:
    branches:
      - main
    paths:
      - "assignment1/**"
      - ".github/workflows/assignment1-ci.yaml"

  pull_request:
    branches: 
      - main

  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: assignment1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect Assignment 1 changes
        id: changes
        working-directory: .
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # Push and manual runs always execute the tests.
          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git diff --quiet "${BASE_SHA}...${HEAD_SHA}" -- \
            assignment1/ .github/workflows/assignment1-ci.yaml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Assignment 1 unchanged; tests are unnecessary."
          else
            status=$?
            if [[ "$status" -ne 1 ]]; then
              exit "$status"
            fi
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.changes.outputs.changed == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: steps.changes.outputs.changed == 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ci.txt
          python -m pip install -r requirements.txt

      - name: Run tests
        if: steps.changes.outputs.changed == 'true'
        run: python -m pytest