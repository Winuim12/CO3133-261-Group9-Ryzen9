name: Assignment 2 CI

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main
    paths:
      - "assignment2/**"
      - ".github/workflows/assignment2-ci.yaml"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  assignment2-tests:
    name: assignment2-tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: assignment2

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect Assignment 2 changes
        id: changes
        working-directory: .
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git diff --quiet "${BASE_SHA}...${HEAD_SHA}" -- \
            assignment2/ .github/workflows/assignment2-ci.yaml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Assignment 2 unchanged; tests are unnecessary."
          else
            status=$?
            if [[ "$status" -ne 1 ]]; then
              exit "$status"
            fi
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.changes.outputs.changed == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.13"

      - name: Install CPU dependencies
        if: steps.changes.outputs.changed == 'true'
        run: |
          python -m pip install -r requirements-cpu.txt
          python -m pip check

      - name: Validate Compose configuration
        if: steps.changes.outputs.changed == 'true'
        run: |
          docker compose -f compose.yaml config --quiet
          docker compose -f compose.yaml -f compose.gpu.yaml config --quiet

      - name: Run tests
        if: steps.changes.outputs.changed == 'true'
        run: python -m pytest tests -v